name: workflow-lint

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so new advisories against the pinned actions reach code scanning
    # between changes.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  # Pull requests: fails on any finding.
  zizmor:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false

  # Pushes to main, the weekly run and manual runs: uploads the findings to code
  # scanning and does not fail on them.
  zizmor-sarif:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # uploads the SARIF log to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: true

  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download actionlint and check its SHA-256
        env:
          ACTIONLINT_VERSION: 1.7.12
          # From actionlint_1.7.12_checksums.txt of the v1.7.12 release.
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint
      - name: Run actionlint
        # actionlint 1.7.12 does not know GitHub's self-repository form uses: $/,
        # which ci.yml's action job runs. The starter template's workflow lies
        # outside .github/workflows, so it is named here.
        run: |
          shopt -s nullglob
          "${RUNNER_TEMP}/actionlint" -ignore 'specifying action "\$/" in invalid format' \
            .github/workflows/*.y*ml templates/whitepaper-starter/.github/workflows/*.y*ml
