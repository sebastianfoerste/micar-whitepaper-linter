name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install from lockfile
        run: uv sync --locked --extra dev
      - name: Lint, test, smoke, review bundle, playground and template checks
        run: make check

  # Runs action.yml from this checkout, so a broken Action shows up before the v1 tag moves.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Strict run on a draft with open blockers
        id: strict
        continue-on-error: true
        uses: ./
        with:
          whitepaper: examples/incomplete.json
          annotations: 'false'
      - name: Report-mode run on a DOCX draft
        id: docx
        uses: ./
        with:
          whitepaper: examples/sample-draft.docx
          strict: 'false'
          extra-args: --type other
          annotations: 'false'
      - name: Strict run fails and both runs write a SARIF log
        env:
          STRICT_OUTCOME: ${{ steps.strict.outcome }}
          STRICT_SARIF: ${{ steps.strict.outputs.sarif-file }}
          DOCX_SARIF: ${{ steps.docx.outputs.sarif-file }}
        run: |
          test "${STRICT_OUTCOME}" = failure
          test -s "${STRICT_SARIF}"
          test -s "${DOCX_SARIF}"
