name: micar-lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-whitepaper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: sebastianfoerste/micar-whitepaper-linter@v1
        with:
          whitepaper: whitepaper.json
          strict: 'true'
