name: Bug report
description: Crash, wrong output format, install problem.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: "What happened and what did you expect?"}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: "Version (micar-lint --version or pip show micar-whitepaper-linter)"}
  - type: textarea
    id: cmd
    attributes: {label: Command and output, render: text}
