# Dependabot opens pull requests only for the commit-pinned Actions here; nothing merges on its own. A repository
# created from this template inherits this file and can delete it; it also proposes the linter Action's next major (v2).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
