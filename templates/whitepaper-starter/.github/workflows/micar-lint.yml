name: micar-lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-whitepaper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The linter is the template owner's own Action. Its v1 tag moves with each linter release, so a repository
      # created from this template receives linter updates without editing this file.
      - uses: sebastianfoerste/micar-whitepaper-linter@v1
        with:
          whitepaper: whitepaper.json
          # Report mode: open findings do not fail the check; they are listed in the log.
          # Set to 'true' to fail the build on any open BLOCKER before you notify the white paper or submit it for approval. The build then
          # always fails: the iXBRL format BLOCKER never passes for whitepaper.json (see README).
          strict: 'false'
